# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Express API and the built React frontend as two services.
# Secrets are marked `sync: false`, so Render prompts for them in the
# dashboard instead of them living in this file.
#
# Before first deploy:
#   1. Create a MongoDB Atlas cluster and allow Render's egress IPs
#      (or 0.0.0.0/0 for a free-tier cluster), then set MONGO_URI.
#   2. Generate JWT_SECRET:
#      node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#   3. After the first deploy, set the API's FRONTEND_ORIGIN and the
#      frontend's VITE_API_ORIGIN to the real service URLs Render assigns.
#
# Note: on the free plan the web service sleeps after ~15 min idle and
# cold-starts in ~50s, which drops Socket.IO chat connections. Use a
# paid instance if live chat needs to stay connected.

services:
  - type: web
    name: kisansetu-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMS_PROVIDER
        value: dev
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_DLT_TEMPLATE_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: kisansetu-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_ORIGIN
        sync: false
    routes:
      # SPA fallback — the app uses hash routing, but this keeps any
      # direct path request from 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
